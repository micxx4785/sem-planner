<style>
:root{--bg:#fff3f0;--card:#fff;--ink:#5b3a4a;--soft:#a9818f;--pink:#ff8fab;--peach:#ffc8a2;--mint:#a8e6cf;--sky:#b8d8ff;--line:#ffd9e2;--track:#ffe3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1d26;--card:#3a2833;--ink:#ffe9f0;--soft:#d3a9b9;--peach:#e8a57d;--mint:#7fcfae;--sky:#8bb6ee;--line:#5a3f4d;--track:#4a3341}}
:root[data-theme="dark"]{--bg:#2a1d26;--card:#3a2833;--ink:#ffe9f0;--soft:#d3a9b9;--peach:#e8a57d;--mint:#7fcfae;--sky:#8bb6ee;--line:#5a3f4d;--track:#4a3341}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Nunito","PingFang SC","Hiragino Maru Gothic ProN","Microsoft YaHei",system-ui,sans-serif;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:14px 14px 60px}
.ban{position:relative;overflow:hidden;border-radius:32px;padding:22px 20px;margin-bottom:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 45%,#fff),color-mix(in srgb,var(--pink) 15%,#fff3dc));color:#5b3a4a}
.ban h1{margin:0;font-size:28px}.ban .yr{position:absolute;right:16px;top:10px;font-size:30px;font-weight:800;opacity:.55}
.ban .sl{display:inline-block;margin-top:4px;font-size:17px;outline:none;border-radius:10px;padding:0 6px}
.ban .fl{position:absolute;font-size:24px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.card{background:var(--card);border-radius:28px;padding:16px;margin-bottom:16px;border:3px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 16px}
.ct{font-weight:800;margin:0 0 10px;font-size:17px}
.deco{margin-top:12px;padding-top:8px;border-top:2px dotted var(--line);font-size:13px;color:var(--soft);display:flex;gap:8px;align-items:center;justify-content:center}
.deco .em{font-size:20px}
.hero{display:flex;gap:14px;align-items:center}.hero svg{flex:none;width:84px;height:84px}
.big{flex:1;min-width:0}.pct{font-size:38px;font-weight:800;color:var(--pink);line-height:1}
.mood{font-size:14px;color:var(--soft);margin-top:4px}
.bar{height:20px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:8px}
.fill{height:100%;border-radius:99px;background:repeating-linear-gradient(135deg,var(--pink) 0 14px,color-mix(in srgb,var(--pink) 70%,white) 14px 28px);transition:width .6s cubic-bezier(.3,1.6,.5,1)}
.tr{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}.tr span:first-child{width:66px;flex:none}.tr .bar{flex:1;margin:0;height:16px}.tr b{width:42px;text-align:right}
.tabs,.set{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tab{background:var(--track)}.tab.on{background:var(--pink);color:#fff}
.sec{margin:12px 0;padding-top:10px;border-top:2px dashed var(--line)}
.sec-h{display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:6px}.sec-h .nm{flex:1}.sec-h small{color:var(--soft)}
.mini{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:6px}.mini i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .5s}
.item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:18px;cursor:pointer;position:relative}
.item:hover{background:var(--track)}.item:focus-within{outline:3px solid var(--sky)}
.item input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:24px;height:24px;border-radius:50%;border:3px solid var(--peach);display:grid;place-items:center;font-size:13px;color:transparent;transition:.2s}
input:checked+.box{background:var(--mint);border-color:var(--mint);color:#2d6a50;transform:scale(1.1)}
.nm{outline:none;border-radius:8px;padding:0 4px;flex:1;min-width:0}.nm:focus{background:var(--track)}
input:checked~.nm{text-decoration:line-through;color:var(--soft)}
.tm{flex:none;font-size:12px;background:var(--track);border-radius:99px;padding:0 8px;color:var(--soft)}
.x{flex:none;background:none;color:var(--soft);padding:2px 8px;font-size:15px}.x:hover{color:var(--pink)}
.add{display:flex;gap:6px;margin-top:6px}.add input[type=text]{flex:1}.add .tmi{flex:none;width:64px}
input[type=text],input[type=date],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--track);border:2px solid transparent;border-radius:16px;padding:6px 12px;min-width:0;width:100%}
.add input{width:auto}.add .tmi{width:64px}
input:focus,textarea:focus{outline:none;border-color:var(--pink)}
textarea{min-height:80px;resize:vertical}
button{font:inherit;border:0;border-radius:99px;padding:6px 14px;background:var(--track);color:var(--ink);cursor:pointer}
button.p{background:var(--pink);color:#fff;font-weight:700}button:focus-visible{outline:3px solid var(--sky)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dw{font-size:12px;color:var(--soft)}
.cd{position:relative;padding:6px 0;border-radius:14px;background:none;font-size:14px}.cd i{position:absolute;right:0;top:-2px;font-size:10px;font-style:normal}
.cd.inwk{background:var(--track)}.cd.today{background:var(--pink);color:#fff;font-weight:800}
.wnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.wnav b{flex:1;min-width:140px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:12px 0}
.day{border:3px solid var(--line);border-radius:22px;padding:10px;background:var(--bg)}.day.tdy{border-color:var(--pink)}
.dh{display:flex;justify-content:space-between;margin-bottom:6px;font-size:16px}.dh small{color:var(--soft)}
.moods,.cups{display:flex;gap:2px;margin:6px 0;flex-wrap:wrap}
.mo,.cp{background:none;padding:0 4px;font-size:18px;opacity:.35}.mo.on,.cp.on{opacity:1;transform:scale(1.2)}
.nums{display:flex;gap:6px;margin-bottom:4px}.nums label{flex:1;font-size:13px;display:flex;gap:4px;align-items:center}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.stat span{background:var(--track);border-radius:99px;padding:2px 12px;font-size:13px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}th{font-size:12px;color:var(--soft)}td{padding:3px;text-align:center}td:first-child{text-align:left}
.hc{width:30px;height:30px;padding:0;border-radius:50%;background:var(--track)}.hc.on{background:var(--mint)}
.awr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:8px;border-radius:20px;background:var(--bg)}.awr input[type=date]{flex:0 0 150px}.awr input[type=text]{flex:1 1 150px}
.vis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0}
.st{position:relative;border-radius:20px;padding:14px 10px;text-align:center;color:#5b3a4a;min-height:100px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.st b{font-size:32px}.st .x{position:absolute;right:2px;top:2px;color:#5b3a4a;opacity:.5}
.s0{background:#ffe0e8;transform:rotate(-2deg)}.s1{background:#dff4e9;transform:rotate(1.5deg)}.s2{background:#e3eeff;transform:rotate(-1deg)}.s3{background:#fff0d9;transform:rotate(2deg)}.s4{background:#efe4ff;transform:rotate(-1.5deg)}
.q4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:10px}
.ev{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:2px dashed var(--line)}.ev:first-of-type{border-top:0}
.dd{flex:none;width:62px;text-align:center;border-radius:18px;padding:5px 0;background:var(--track)}.dd b{display:block;font-size:22px;line-height:1.1}.dd span{font-size:11px;color:var(--soft)}
.ev.soon .dd{background:var(--pink);color:#fff}.ev.soon .dd span{color:#fff}.ev.past{opacity:.45}
.ev h3{margin:0;font-size:15px}.ev p{margin:0;font-size:13px;color:var(--soft)}.ev>div:nth-child(2){flex:1;min-width:0}
.evadd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.evadd input[type=text]{flex:1;min-width:110px;width:auto}.evadd input[type=date]{width:auto}
.pomo{text-align:center}.clock{font-size:54px;font-weight:800;color:var(--pink);line-height:1.1}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:14px}.row input{width:64px}
.chip{border:2px solid var(--line);background:none;font-size:13px}.chip.on{background:var(--mint);border-color:var(--mint);color:#2d6a50}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid var(--card)}.sw.on{outline:3px solid var(--ink)}
.lb{font-size:13px;color:var(--soft);margin:8px 0 2px}.tip{font-size:12px;color:var(--soft);margin:4px 0 0}
[data-o][contenteditable=true]:focus{background:var(--track);border-radius:8px;outline:none}
select{font:inherit;color:var(--ink);background:var(--track);border:2px solid transparent;border-radius:16px;padding:6px 10px}
.cl small{display:block;color:var(--soft);font-size:12px}.cl{align-items:flex-start;background:var(--track);margin:3px 0}
.pop{position:fixed;inset:0;pointer-events:none;overflow:hidden}.pop span{position:absolute;top:-30px;font-size:22px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fill,.mini i,.box{transition:none}.pop,.ban .fl{display:none}}

.auth-gate{position:fixed;inset:0;z-index:9999;background:rgba(91,58,74,.28);display:grid;place-items:center;padding:18px;backdrop-filter:blur(7px)}
.auth-card{width:min(430px,100%);background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 18px 60px rgba(91,58,74,.2)}
.auth-card h2{margin:0 0 6px;font-size:23px}.auth-card p{color:var(--soft);font-size:14px;margin:4px 0 14px}.auth-card input{margin:6px 0}.auth-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.auth-status{min-height:22px;color:var(--soft);font-size:13px;margin-top:10px}.auth-user{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:0 0 10px;color:var(--soft);font-size:12px}


/* Global typography: English/numbers in Times New Roman; Chinese in KaiTi. */
html, body, body * {
  font-family: "Times New Roman", "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif !important;
}
input, textarea, select, button {
  font-family: "Times New Roman", "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif !important;
}


/* Cute study progress + completion celebration */
.study-progress{height:25px;border-radius:999px;background:linear-gradient(90deg,#ffe8ef,#fff1d9);overflow:hidden;margin-top:10px;border:2px solid #ffe0e9;box-shadow:inset 0 2px 4px rgba(255,143,171,.10)}
.study-progress .fill{height:100%;position:relative;overflow:hidden;background:linear-gradient(90deg,#ff9ab7,#ffb7cb 55%,#ffd1a4);border-radius:999px;box-shadow:0 2px 7px rgba(255,143,171,.28)}
.study-progress .fill:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.65) 48%,transparent 72%);transform:translateX(-100%);animation:progressShine 2.8s ease-in-out infinite}
@keyframes progressShine{to{transform:translateX(100%)}}
.sec .mini{height:13px;background:linear-gradient(90deg,#effaf5,#e4f8ef);border:1px solid #d8f3e8;border-radius:99px;padding:1px}
.sec .mini i{background:linear-gradient(90deg,#9be5cc,#b7efd9);position:relative}
.sec .mini i:after{content:"✦";position:absolute;right:4px;top:-4px;color:#fff;font-size:10px}
.topic-block{margin:10px 4px 8px 18px;padding:9px 11px 7px;border-left:3px solid #ffd1df;border-radius:0 15px 15px 0;background:linear-gradient(100deg,rgba(255,232,239,.62),rgba(255,255,255,.15))}
.topic-head{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--soft);margin-bottom:5px}
.topic-head .topic-name{flex:1;min-width:0}.topic-head small{font-size:11px;color:var(--soft)}
.topic-add{display:flex;gap:6px;align-items:center;margin:7px 0 2px 18px}.topic-add input{flex:1;min-width:0}
.sec.is-done{background:linear-gradient(120deg,rgba(168,230,207,.14),rgba(255,240,246,.42));border-radius:18px;padding:12px 10px;border-top-color:#b9ead8;animation:doneGlow 1.2s ease}
.sec.is-done .sec-h:after{content:"🌸 已完成";font-size:12px;color:#65b99a;background:#e5f8ef;border-radius:99px;padding:3px 9px;animation:badgePop .55s cubic-bezier(.2,1.7,.4,1)}
@keyframes doneGlow{0%{box-shadow:0 0 0 0 rgba(168,230,207,0)}45%{box-shadow:0 0 0 7px rgba(168,230,207,.35)}100%{box-shadow:0 0 0 0 rgba(168,230,207,0)}}
@keyframes badgePop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.study-complete{animation:studyBounce .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes studyBounce{0%{transform:scale(1)}35%{transform:scale(1.035) rotate(-1deg)}70%{transform:scale(.99) rotate(1deg)}100%{transform:scale(1)}}
.study-spark{position:fixed;z-index:9998;pointer-events:none;font-size:24px;animation:studySpark .95s ease-out forwards}
@keyframes studySpark{0%{opacity:0;transform:translate(0,10px) scale(.4) rotate(-20deg)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.35) rotate(35deg)}}
@media(prefers-reduced-motion:reduce){.study-progress .fill:after,.sec.is-done,.study-complete,.study-spark{animation:none}}

</style>
